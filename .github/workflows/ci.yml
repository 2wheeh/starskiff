name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build & Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Published-image allowlist guard (maroo hard rule)
        run: node scripts/check-image-allowlist.mjs

      - name: Build & Type check
        run: pnpm check

      - name: Packed-package acceptance
        run: pnpm test:package

      - name: Smoke ESM export
        run: node --input-type=module --eval "await import('./package/dist/index.js')"

      - name: Unit & Smoke tests
        run: pnpm test:unit

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Host tools are fetched directly from their upstream releases. Chain
      # nodes use images instead; config/images.json owns images we publish.
      - name: Download prebuilt binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pipeline (not `< <(...)`) so pipefail propagates a jq failure and
          # aborts the job; process substitution would run jq async with its
          # exit status ignored by set -e.
          jq -c '.binaries[] | select(.buildType == "prebuilt")' config/binaries.json \
          | while IFS= read -r row; do
            name=$(jq -r '.name' <<<"$row")
            repo=$(jq -r '.repo' <<<"$row")
            ref=$(jq -r '.ref' <<<"$row")
            asset=$(jq -r '.asset' <<<"$row")
            checksum=$(jq -er '.sha256' <<<"$row")
            extract=$(jq -r '.extract // "none"' <<<"$row")  # null -> "none", not literal "null"

            gh release download "$ref" --repo "$repo" --pattern "$asset" --dir /tmp
            echo "${checksum}  /tmp/${asset}" | sha256sum --check --strict

            if [ "$extract" = "tar" ]; then
              tar -xzf "/tmp/${asset}" -C /tmp
            else
              mv "/tmp/${asset}" "/tmp/${name}"
            fi

            mv "/tmp/${name}" "/usr/local/bin/${name}"
            chmod +x "/usr/local/bin/${name}"
          done

      - name: Integration tests
        run: pnpm test:integration

      # Feature project tests whose deps exist on CI: the *-docker suites pull
      # public images (xplad/mantra official, xrplevm amd64-only — fine on
      # amd64 runners, evmd the digest-pinned image starskiff publishes), and
      # extra-validators uses the simd image. marood (private binary) stays
      # excluded.
      - name: Feature tests (container runtime + multi-validator)
        run: pnpm --filter starskiff exec vitest run test/xplad-docker.test.ts test/evmd-docker.test.ts test/xrplevm-docker.test.ts test/mantra-docker.test.ts test/extra-validators.test.ts

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, docs, integration]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
